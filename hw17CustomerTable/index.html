<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Calderon Computer Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 1000px;">
        <h1>Clientes - Calderon Computer Store</h1>
        
        <div id="error-container"></div>
        
        <div class="stats-container">
            <div class="row">
                <div class="col-md-3">
                    <div class="stat-card">
                        <h5>Total de Clientes</h5>
                        <div class="value" id="totalCustomers">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <h5>Dinero Total Gastado</h5>
                        <div class="value" id="totalSpent">$0.00</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <h5>Promedio Gastado</h5>
                        <div class="value" id="avgSpent">$0.00</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <h5>Edad Promedio</h5>
                        <div class="value" id="avgAge">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-3">Cargando datos...</p>
        </div>

        <div id="table-container" style="display: none;">
            <div class="row mb-3">
                <div class="col-md-4 offset-md-8">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Buscar por nombre...">
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Dinero Gastado</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody">
                    </tbody>
                </table>
            </div>

            <nav aria-label="Navegación de páginas" class="mt-4">
                <ul class="pagination justify-content-center" id="paginationContainer">
                    </ul>
            </nav>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
